name: Bug report
description: An image or tool behaves differently from what the README or a module page says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach an image, slice, `.syx` or firmware dump. Describe it.
        `docs/contributing/FAILURE_MODES.md` lists failures already seen.
  - type: input
    id: remix
    attributes:
      label: Remix and BUILD
      description: Remix name and the BUILD tag shown on the unit or in the file name.
      placeholder: "bus, BUILD=B2"
    validations:
      required: true
  - type: dropdown
    id: unit
    attributes:
      label: Unit
      options: [MKI, MKII, Port only (no hardware)]
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD` for the tree that built the image.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps
      description: Project/pattern state, the knobs or pages touched, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: Exact on-screen text, audio behaviour, whether it recurs after power cycle.
    validations:
      required: true
  - type: textarea
    id: measured
    attributes:
      label: Measured / inferred
      description: What was measured and how; what is a guess; what would falsify it.
  - type: input
    id: gate
    attributes:
      label: Gate result
      description: "`make check REMIX=<name>` result on the same tree, if run."
