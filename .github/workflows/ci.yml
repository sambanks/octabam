# Most jobs run without Elektron bytes. `plan` and `gates` download the 1.40C from
# Elektron's site (scripts/fetch-os.sh, zip hash pinned) into the runner's
# working tree on every run (.github/actions/gates-setup); the bytes are not
# cached, not uploaded as an artifact and not printed. `plan` builds each reached
# remix's image, lists the units `make reach` plans (one per gate job, one per shared
# module gate) and leaves out the ones whose pass is recorded for the same image
# and inputs; `gates` is the matrix over the rest, a runner each, and `gates-result`
# is the one check that stands for all of them and writes the pass store. It runs
# for pushes to main and for every pull request, fork PRs included: a fork PR's code
# runs with the firmware on the runner's disk, and the repository's approval policy
# for fork PR workflows (first_time_contributors) decides who is held first.
# Each job is one make target, so a red job reproduces with the same command.
# `classify` gates each job on whether the diff touches its inputs
# (tools/verify/ci_paths.py holds the map); it errs toward running: a
# workflow, Makefile or scripts change runs everything, and `make ci`
# locally still runs everything.
name: ✅ CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    # Which of the jobs below this diff can reach; a skipped job is a grey
    # check, not a pass. No usable diff (workflow_dispatch) -> everything.
    name: 🔍 Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coldfire: ${{ steps.map.outputs.coldfire }}
      dsp: ${{ steps.map.outputs.dsp }}
      acceptance: ${{ steps.map.outputs.acceptance }}
      reach: ${{ steps.map.outputs.reach }}
      site: ${{ steps.map.outputs.site }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 🔍 Detect Changed Paths
        id: map
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          python3 tools/verify/ci_paths.py --base "$base" --github-output >> "$GITHUB_OUTPUT"

  plan:
    # The units this diff reaches (tools/verify/reach.py --json: `matrix`), one per gate job, without the ones whose
    # pass is recorded for the same image and inputs (`--lookup`: each reached remix's image is built here and every
    # unit's gate_cache key computed). Holds the 1.40C like a unit does, because the keys are of the images built from
    # it. It also makes the generated project (tools/hw/ot_fresh.py) once per remix that has a unit reading one, and
    # hands it to those units as an artifact; the bytes are not cached outside the runner's own .git, not printed.
    name: 🗺️ Plan Gates
    needs: classify
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request')
      && needs.classify.outputs.reach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      projects: ${{ steps.plan.outputs.projects }}
    env:
      OS_HASH_STRICT: '1'
      # no PGO training in CI (tools/emu/port_store.py)
      OCTABAM_PGO: '0'
      # the optional tools (binwalk, radare2) are 127 MB of apt downloads
      OPTIONAL_TOOLS: '0'
      EXTRA_PACKAGES: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # actions/checkout updates submodules one at a time; these are 16 clones
      - name: 📥 Submodules
        run: git submodule update --init --force --depth 1 --jobs 16

      - name: 🧰 Setup
        uses: ./.github/actions/gates-setup
        with:
          save: 'true'

      # The gate passes (tools/verify/gate_cache.py) are one cache entry per run: this run's units upload what they
      # record as artifacts and `gates-result` writes the merged store. A PR run restores the newest entry of its own
      # branch, else of the base branch.
      - name: 💾 Restore Gate Passes
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/octabam-gate-cache
          key: gate-store-@${{ github.run_id }}
          restore-keys: gate-store-@

      # an empty project made by the firmware itself under the port from this runner's own OS, kept by image, port and
      # script (tools/hw/ot_fresh.py)
      - name: 💾 Restore Fresh Projects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/octabam-fresh-cache
          key: fresh-@${{ github.run_id }}
          restore-keys: fresh-@

      # --jobs is the shards per unit on a runner; the `gates` job passes the same value, because --only plans again
      # and the two plans must agree
      - name: 🗺️ Plan
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          mkdir -p .git/octabam-gate-cache .git/octabam-fresh-cache
          touch "$RUNNER_TEMP/plan-start"
          ls .git/octabam-fresh-cache > "$RUNNER_TEMP/fresh-before"
          python3 tools/verify/reach.py --json --jobs 3 --base "$base" > "$RUNNER_TEMP/plan0.json"
          projects="$(python3 -c "import json,sys; print(' '.join(json.load(open(sys.argv[1]))['projects']))" "$RUNNER_TEMP/plan0.json")"
          for r in $projects; do
            .venv/bin/python3 tools/hw/ot_fresh.py --remix "$r" --out out/fresh
          done
          python3 tools/verify/reach.py --json --lookup --jobs 3 --base "$base" > "$RUNNER_TEMP/plan.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/plan.json"))
          m = d["matrix"]
          print("matrix=" + json.dumps([{"name": e["name"], "remix": e["remix"], "project": e["project"]} for e in m]))
          print(f"count={len(m)}")
          print("projects=" + " ".join(sorted({e["remix"] for e in m if e["project"]})))
          PY
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/plan.json"))
          print(f"{len(d['matrix'])} units to run, {len(d['cached'])} with a pass recorded for the same image and inputs\n")
          print("| unit | project | commands |\n|---|---|---|")
          for e in d["matrix"]:
              print(f"| {e['name']} | {'yes' if e['project'] else ''} | " + "<br>".join(f"`{c}`" for c in e["commands"]) + " |")
          if d["cached"]:
              print("\n| cached unit | key |\n|---|---|")
              for n, ks in d["cached"].items():
                  print(f"| {n} | " + ", ".join(f"`{k}`" for k in ks) + " |")
          PY
          # the passes this plan read, for the store `gates-result` writes (a hit refreshes the file's mtime)
          mkdir -p "$RUNNER_TEMP/passes-out"
          find .git/octabam-gate-cache -name '*.json' -newer "$RUNNER_TEMP/plan-start" -exec cp {} "$RUNNER_TEMP/passes-out/" \;
          ls .git/octabam-fresh-cache | diff -q - "$RUNNER_TEMP/fresh-before" >/dev/null || echo "fresh=new" >> "$GITHUB_OUTPUT"
          [ -d out/fresh ] && tar -cf "$RUNNER_TEMP/fresh.tar" -C out fresh || true

      - name: 💾 Save Fresh Projects
        if: steps.plan.outputs.fresh == 'new'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/octabam-fresh-cache
          key: fresh-@${{ github.run_id }}

      # tar: upload-artifact drops empty directories
      - name: 📤 Upload Fresh Projects
        if: steps.plan.outputs.projects != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fresh-projects
          path: ${{ runner.temp }}/fresh.tar
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: 📤 Upload Gate Passes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: passes-plan
          path: ${{ runner.temp }}/passes-out
          retention-days: 1
          if-no-files-found: ignore
          overwrite: true

      # saved on main only: the key is per run, an entry saved from a PR is read by no other ref, and 29 of them were
      # 8 GB of the repository's 10 GB cache limit, evicting the toolchain and port caches
      - name: 💾 Save Compiler Cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - name: 📊 Compiler Cache Statistics
        if: always()
        run: ccache -s || true

  gates:
    # One unit of the plan (make reach --only) against the stock 1.40C fetched into this runner. A unit is one gate
    # job of one remix (or one shared module gate): `check-remix <remix> (<job>)`, `check-shared (<gate>)`.
    name: 🧪 Gates — ${{ matrix.name }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OS_HASH_STRICT: '1'
      # no PGO training in CI (tools/emu/port_store.py)
      OCTABAM_PGO: '0'
      # the optional tools (binwalk, radare2) are 127 MB of apt downloads
      OPTIONAL_TOOLS: '0'
      EXTRA_PACKAGES: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # actions/checkout updates submodules one at a time; these are 16 clones
      - name: 📥 Submodules
        run: git submodule update --init --force --depth 1 --jobs 16

      - name: 🧰 Setup
        uses: ./.github/actions/gates-setup

      # scripts/refhash.sh check compares against the 24 builds of the merge-base
      # (tools/verify/refhash_store.py), built on the runner when the store has
      # none: hashes and normalised build logs, no firmware. A later push to the
      # same PR on the same merge-base restores them.
      - name: 🔑 Key the Refhash Baseline
        id: refhash
        if: matrix.name == 'refhash'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          echo "key=$(python3 tools/verify/refhash_store.py key --base "$base")" >> "$GITHUB_OUTPUT"

      - name: 💾 Restore Refhash Baseline
        id: refhashcache
        if: matrix.name == 'refhash'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/octabam-refhash
          key: refhash-${{ steps.refhash.outputs.key }}

      # the passes the plan read: a job of this unit with a pass recorded is not run (a unit holds several jobs when the
      # plan is over reach.MATRIX_LIMIT, and a job a plan lookup could not key still checks here)
      - name: 💾 Restore Gate Passes
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/octabam-gate-cache
          key: gate-store-@${{ github.run_id }}
          restore-keys: gate-store-@

      # The generated project (tools/hw/ot_fresh.py, made by `plan`) of a unit that reads one: Gate(project=True),
      # reach.PROJECT_SET's `set`, and the verify_brain and verify_scenes jobs of reach.SPLIT_EXTRA_UNITS. The `image:`
      # jobs without the flag have none: with a project they ran 2869 s and verify_brain failed.
      - name: 📁 Download Fresh Project
        if: matrix.project
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fresh-projects
          path: ${{ runner.temp }}/fresh

      - name: 📁 Unpack Fresh Project
        if: matrix.project
        env:
          REMIX: ${{ matrix.remix }}
        run: |
          mkdir -p out
          tar -xf "$RUNNER_TEMP/fresh/fresh.tar" -C out
          echo "OT_PROJECT=$PWD/out/fresh/$REMIX/NOPROJ" >> "$GITHUB_ENV"

      # the unit's name goes through the environment: it can carry a remix name
      - name: 🧪 Run Gates
        env:
          UNIT: ${{ matrix.name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          touch "$RUNNER_TEMP/unit-start"
          set -o pipefail
          make reach RUN=1 KEEP=1 JOBS=3 BASE="$base" REACHARGS='--only "'"$UNIT"'"' 2>&1 | tee "$RUNNER_TEMP/reach.log"

      # the unit's result tables and failure excerpts on the run's summary
      # page, under its name
      - name: 📝 Unit Summary
        if: always()
        env:
          UNIT: ${{ matrix.name }}
        run: |
          [ -f "$RUNNER_TEMP/reach.log" ] || exit 0
          {
            echo "### 🧪 $UNIT"
            echo '```'
            awk '/^check_shards: results/ {p=1} p && /^$/ {p=0} p' "$RUNNER_TEMP/reach.log"
            sed -n '/^reach: results/,$p' "$RUNNER_TEMP/reach.log"
            echo '```'
            if grep -qE '^(check_shards: .* failed \(exit|  \| )' "$RUNNER_TEMP/reach.log"; then
              echo '```'
              grep -E '^(check_shards: .* failed \(exit|  \| )' "$RUNNER_TEMP/reach.log" | head -60
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # the passes this unit recorded (check_shards and module_gates store a pass per gate job, a file each)
      - name: 📦 Collect Gate Passes
        id: passes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/passes-out"
          [ -f "$RUNNER_TEMP/unit-start" ] || exit 0
          find .git/octabam-gate-cache -name '*.json' -newer "$RUNNER_TEMP/unit-start" -exec cp {} "$RUNNER_TEMP/passes-out/" \; 2>/dev/null || true
          [ -n "$(ls "$RUNNER_TEMP/passes-out")" ] && echo "any=true" >> "$GITHUB_OUTPUT" || true

      - name: 📤 Upload Gate Passes
        if: always() && steps.passes.outputs.any == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: passes-${{ strategy.job-index }}
          path: ${{ runner.temp }}/passes-out
          retention-days: 1
          overwrite: true      # a re-run of the unit uploads again

      - name: 🧮 Check Refhash Baseline Saved
        id: refhashdone
        if: always() && matrix.name == 'refhash'
        run: ls .git/octabam-refhash/*/manifest.txt >/dev/null 2>&1 && echo saved=true >> "$GITHUB_OUTPUT" || true

      - name: 💾 Save Refhash Baseline
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && matrix.name == 'refhash' && steps.refhashcache.outputs.cache-hit != 'true' && steps.refhashdone.outputs.saved == 'true'
        with:
          path: .git/octabam-refhash
          key: refhash-${{ steps.refhash.outputs.key }}

      - name: 📊 Compiler Cache Statistics
        if: always()
        run: ccache -s || true

  gates-result:
    # The one check for the gates: green when the plan ran and every unit
    # passed (or the plan had none). It also writes the pass store: the
    # passes of the plan's lookup and of every unit, merged into one cache entry.
    name: 🧪 Gates — make reach
    needs: [classify, plan, gates]
    if: >-
      always()
      && (github.event_name == 'push' || github.event_name == 'pull_request')
      && needs.classify.outputs.reach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      # the same path as `plan`'s: the path is part of a cache's version
      - name: 💾 Restore Gate Passes
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/octabam-gate-cache
          key: gate-store-@${{ github.run_id }}
          restore-keys: gate-store-@

      - name: 📥 Download Gate Passes
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: passes-*
          merge-multiple: true
          path: ${{ runner.temp }}/passes-in

      # a pass is a file of its own; one unused for 14 days is dropped so the entry does not grow without bound
      - name: 🧹 Merge Gate Passes
        id: merge
        run: |
          mkdir -p .git/octabam-gate-cache
          if [ -d "$RUNNER_TEMP/passes-in" ] && [ -n "$(ls "$RUNNER_TEMP/passes-in")" ]; then
            cp "$RUNNER_TEMP"/passes-in/*.json .git/octabam-gate-cache/
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          find .git/octabam-gate-cache -name '*.json' -mtime +14 -delete 2>/dev/null || true

      - name: 💾 Save Gate Passes
        if: steps.merge.outputs.new == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/octabam-gate-cache
          key: gate-store-@${{ github.run_id }}

      - name: 🧮 Gate Results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gates.result }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          echo "plan: $PLAN, units: $COUNT, gates: $GATES"
          {
            echo "### 🧪 Gates"
            echo "plan: $PLAN, units: $COUNT, gates: $GATES"
            echo
            echo "| unit | result | time |"
            echo "|---|---|---|"
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate --jq '
              .jobs[] | select(.name | startswith("🧪 Gates — ")) | select(.name != "🧪 Gates — make reach")
              | "| [\(.name | ltrimstr("🧪 Gates — "))](\(.html_url)) | \(.conclusion // .status) | "
                + "\(if .completed_at then ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) else 0 end) s |"' || true
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$PLAN" = success ] || exit 1
          [ "$GATES" = success ] || { [ "$COUNT" = 0 ] && [ "$GATES" = skipped ]; }

  docs:
    # Docs, the manual site, the web builder's patches and the acceptance
    # runner's tests: all load the
    # registry, whose manifests read the author submodules, so one checkout
    # serves them. The site builds with MkDocs shadcn: the generator runs the
    # registry, and mkdocs --strict fails on a bad manifest, a broken link or
    # a broken snippet include; the deploy is the Pages workflow on main, a PR
    # builds without deploying. The patches (docs/site/builder/) need no
    # firmware: the manifest must match the patch files, and on main each
    # remix the code has moved past is reported as a warning (rebuilt from a
    # machine with the user's 1.40C: make webpatch BUILD=N).
    name: 📚 Docs, Site and Web Patches
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # actions/checkout updates submodules one at a time; these are 16 clones
      - name: 📥 Submodules
        run: git submodule update --init --force --depth 1 --jobs 16

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # the manual site's pages include the generated reference files, so
      # they must exist before the doclinks scan of the tracked pages
      - name: 📝 Generate Pages
        run: python3 tools/site/gen_pages.py

      - name: 🔗 Verify Docs
        run: make verify-docs

      - name: 🧩 Check Patch Manifest
        run: |
          if [ -f docs/site/builder/manifest.json ]; then
            python3 tools/web/stale.py --check
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then python3 tools/web/stale.py; fi
          else
            echo "no published patches yet"
          fi

      # firmware-free tests of the acceptance runner and the reach classifier
      # (make test-acceptance); lsof is the card inspection tool's
      - name: ✅ Acceptance Runner Tests
        if: ${{ !cancelled() && needs.classify.outputs.acceptance == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y lsof && make test-acceptance

      - name: 📦 Install Site Dependencies
        if: github.event_name == 'pull_request' && needs.classify.outputs.site == 'true'
        run: pip install -r docs/site/requirements.txt

      - name: 🏗️ Build Site
        if: github.event_name == 'pull_request' && needs.classify.outputs.site == 'true'
        run: mkdocs build --strict --config-file docs/site/mkdocs.yml

  dsp-toolchain:
    name: 🎛️ DSP Toolchain — dsp56300
    needs: classify
    if: needs.classify.outputs.dsp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🎛️ Build and Test dsp56300
        run: make ci-dsp

  coldfire-port:
    name: 🔌 ColdFire Port Unit Tests (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.coldfire == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔌 Build and Test ColdFire Port
        run: make ci-emu
