# Most jobs run without Elektron bytes. `gates` downloads the 1.40C from
# Elektron's site (scripts/fetch-os.sh, zip hash pinned) into the runner's
# working tree on every run and runs the gates `make reach` plans, one unit
# per runner (`plan` lists the units, `gates` is the matrix over them,
# `gates-result` is the one check that stands for all of them); the bytes
# are not cached, not uploaded as an artifact and not printed. It runs for pushes
# to main and for every pull request, fork PRs included: a fork PR's code runs
# with the firmware on the runner's disk, and the repository's approval policy
# for fork PR workflows (first_time_contributors) decides who is held first.
# Each job is one make target, so a red job reproduces with the same command.
# `classify` gates each job on whether the diff touches its inputs
# (tools/verify/ci_paths.py holds the map); it errs toward running: a
# workflow, Makefile or scripts change runs everything, and `make ci`
# locally still runs everything.
name: ✅ CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    # Which of the jobs below this diff can reach; a skipped job is a grey
    # check, not a pass. No usable diff (workflow_dispatch) -> everything.
    name: 🔍 Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coldfire: ${{ steps.map.outputs.coldfire }}
      dsp: ${{ steps.map.outputs.dsp }}
      acceptance: ${{ steps.map.outputs.acceptance }}
      reach: ${{ steps.map.outputs.reach }}
      site: ${{ steps.map.outputs.site }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 🔍 Detect Changed Paths
        id: map
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          python3 tools/verify/ci_paths.py --base "$base" --github-output >> "$GITHUB_OUTPUT"

  plan:
    # The gates this diff reaches, as the units that run on a runner each
    # (tools/verify/reach.py --json: `matrix`). Runs no firmware.
    name: 🗺️ Plan Gates
    needs: classify
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request')
      && needs.classify.outputs.reach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # actions/checkout updates submodules one at a time; these are 16 clones
      - name: 📥 Submodules
        run: git submodule update --init --force --depth 1 --jobs 16

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # --jobs is the shards per remix on a runner; the `gates` job passes the
      # same value, because --only plans again and the two plans must agree
      - name: 🗺️ Plan
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          python3 tools/verify/reach.py --json --jobs 3 --base "$base" > "$RUNNER_TEMP/plan.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open(os.environ["RUNNER_TEMP"] + "/plan.json"))["matrix"]
          print("matrix=" + json.dumps([{"name": e["name"]} for e in m]))
          print(f"count={len(m)}")
          PY
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          m = json.load(open(os.environ["RUNNER_TEMP"] + "/plan.json"))["matrix"]
          print("| unit | commands |\n|---|---|")
          for e in m:
              print(f"| {e['name']} | " + "<br>".join(f"`{c}`" for c in e["commands"]) + " |")
          PY

  gates:
    # One unit of the plan (make reach --only) against the stock 1.40C fetched
    # into this runner. The caches hold the toolchain, the dsp56300 build, the ColdFire
    # port and compiler output; no cache or upload step touches downloads/ or
    # out/ (the stock OS and what is derived from it).
    name: 🧪 Gates — ${{ matrix.name }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OS_HASH_STRICT: '1'
      # no PGO training in CI (tools/emu/port_store.py)
      OCTABAM_PGO: '0'
      # the optional tools (binwalk, radare2) are 127 MB of apt downloads
      OPTIONAL_TOOLS: '0'
      EXTRA_PACKAGES: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # actions/checkout updates submodules one at a time; these are 16 clones
      - name: 📥 Submodules
        run: git submodule update --init --force --depth 1 --jobs 16

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # keyed by the pinned versions: an edit to the script that leaves them
      # alone keeps the cache
      - name: 🔢 Toolchain Versions
        id: m68kver
        run: echo "v=$(scripts/m68k-toolchain.sh --versions)" >> "$GITHUB_OUTPUT"

      - name: 💾 Restore Toolchain Cache
        id: m68k
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/m68k-elf
          key: m68k-elf-${{ runner.os }}-${{ steps.m68kver.outputs.v }}

      # the pinned dsp56300 checkout with its patch and build; every input of
      # scripts/setup.sh's build of it is in the key
      - name: 💾 Restore DSP Toolchain Cache
        id: dsp
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/dsp56300
          key: dsp56300-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/vendor.sh', 'scripts/setup.sh', 'tools/patches/dsp56300.patch', 'tools/harness/dsp_host/**') }}

      - name: 💾 Restore Compiler Cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      # apt packages (the optional tools and the gcc build dependencies only
      # when needed), the m68k toolchain (a no-op when restored), then setup.sh
      - name: 🚀 Install System Tools and Toolchain
        run: |
          echo "$HOME/.local/m68k-elf/bin" >> "$GITHUB_PATH"
          scripts/setup-linux.sh

      # saved when the toolchain is complete (libgcc is its last install step),
      # also after a later failure; a partial tree would be cached under the key for good
      - name: 🧮 Check Caches Complete
        id: done
        if: always()
        run: |
          find ~/.local/m68k-elf -name libgcc.a 2>/dev/null | grep -q . && echo m68k=true >> "$GITHUB_OUTPUT" || true
          [ -x vendor/dsp56300/build/source/dsp_host/dsp_host ] && [ -x vendor/dsp56300/build/source/dsp_host/dsp_asm ] \
            && [ -x vendor/dsp56300/build/source/disassemble/dsp56kDisassemble ] && echo dsp=true >> "$GITHUB_OUTPUT" || true

      - name: 💾 Save Toolchain Cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && steps.m68k.outputs.cache-hit != 'true' && steps.done.outputs.m68k == 'true'
        with:
          path: ~/.local/m68k-elf
          key: m68k-elf-${{ runner.os }}-${{ steps.m68kver.outputs.v }}

      - name: 💾 Save DSP Toolchain Cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && steps.dsp.outputs.cache-hit != 'true' && steps.done.outputs.dsp == 'true'
        with:
          path: vendor/dsp56300
          key: dsp56300-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/vendor.sh', 'scripts/setup.sh', 'tools/patches/dsp56300.patch', 'tools/harness/dsp_host/**') }}

      - name: ⬇️ Fetch Stock OS
        run: make os

      - name: 🔬 Extract Main OS
        run: make recon

      - name: 📦 Install Remixer Dependencies
        run: pip install uv && make emu-setup && git checkout -- uv.lock   # uv sync rewrites it; reach would read it as a change

      # the ColdFire port, built once per source state into .git/octabam-port
      # (tools/emu/port_store.py); `reach` and its shards install from there
      - name: 🔑 Key the ColdFire Port
        id: port
        run: echo "key=$(python3 tools/emu/port_store.py key)" >> "$GITHUB_OUTPUT"

      - name: 💾 Restore ColdFire Port Cache
        id: portcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/octabam-port
          key: port-${{ steps.port.outputs.key }}

      # check_shards orders its jobs longest-first from the durations of the last
      # run (<git common dir>/octabam-gate-times.json) and skips a gate whose pass
      # is recorded for the same image and inputs (octabam-gate-cache,
      # tools/verify/gate_cache.py). Neither survives a runner, so both go
      # through the cache, keyed by unit. A PR run restores the newest entry of
      # its own branch, else of the base branch.
      - name: 🔑 Name the Unit's Caches
        id: unit
        env:
          UNIT: ${{ matrix.name }}
        run: echo "slug=$(printf '%s' "$UNIT" | tr -c 'A-Za-z0-9\n' '-')" >> "$GITHUB_OUTPUT"

      - name: 💾 Restore Gate Times and Passes
        id: gatecache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .git/octabam-gate-times.json
            .git/octabam-gate-cache
            .git/octabam-fresh-cache
          key: gates-${{ steps.unit.outputs.slug }}-${{ github.run_id }}
          restore-keys: gates-${{ steps.unit.outputs.slug }}-

      # The set gates (mode-defaults, plocks-p2, set, ...) SKIP without a project. An empty one is made by the
      # firmware itself under the port from the runner's own OS (tools/hw/ot_fresh.py), on the unit's remix, and kept
      # in .git/octabam-fresh-cache by image, port and script. Only the `(project)` unit of a remix (reach.SPLIT_REMIX_JOBS)
      # runs the jobs that read it; the image job is not one: with a project it ran 2869 s and failed in verify_brain.
      - name: 📁 Fresh Project
        if: contains(matrix.name, ' (project)')
        env:
          UNIT: ${{ matrix.name }}
        run: |
          remix="${UNIT#check-remix }"
          remix="${remix% (project)}"
          make emu-get
          .venv/bin/python3 tools/hw/ot_fresh.py --remix "$remix" --out out/fresh
          echo "OT_PROJECT=$PWD/out/fresh/$remix/NOPROJ" >> "$GITHUB_ENV"

      # the unit's name goes through the environment: it can carry a remix name
      - name: 🧪 Run Gates
        env:
          UNIT: ${{ matrix.name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          set -o pipefail
          make reach RUN=1 KEEP=1 JOBS=3 BASE="$base" REACHARGS='--only "'"$UNIT"'"' 2>&1 | tee "$RUNNER_TEMP/reach.log"

      # the unit's result tables and failure excerpts on the run's summary
      # page, under its name
      - name: 📝 Unit Summary
        if: always()
        env:
          UNIT: ${{ matrix.name }}
        run: |
          [ -f "$RUNNER_TEMP/reach.log" ] || exit 0
          {
            echo "### 🧪 $UNIT"
            echo '```'
            awk '/^check_shards: results/ {p=1} p && /^$/ {p=0} p' "$RUNNER_TEMP/reach.log"
            sed -n '/^reach: results/,$p' "$RUNNER_TEMP/reach.log"
            echo '```'
            if grep -qE '^(check_shards: .* failed \(exit|  \| )' "$RUNNER_TEMP/reach.log"; then
              echo '```'
              grep -E '^(check_shards: .* failed \(exit|  \| )' "$RUNNER_TEMP/reach.log" | head -60
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # a pass is a file of its own; one unused for 14 days is dropped so the
      # entry does not grow without bound
      - name: 🧹 Prune Gate Passes
        id: gatedone
        if: always()
        run: |
          find .git/octabam-gate-cache -name '*.json' -mtime +14 -delete 2>/dev/null || true
          [ -f .git/octabam-gate-times.json ] && echo recorded=true >> "$GITHUB_OUTPUT" || true

      - name: 💾 Save Gate Times and Passes
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && steps.gatedone.outputs.recorded == 'true'
        with:
          path: |
            .git/octabam-gate-times.json
            .git/octabam-gate-cache
            .git/octabam-fresh-cache
          key: gates-${{ steps.unit.outputs.slug }}-${{ github.run_id }}

      - name: 🧮 Check ColdFire Port Built
        id: portdone
        if: always()
        run: ls .git/octabam-port/*/ot_emu >/dev/null 2>&1 && echo built=true >> "$GITHUB_OUTPUT" || true

      - name: 💾 Save ColdFire Port Cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && steps.portcache.outputs.cache-hit != 'true' && steps.portdone.outputs.built == 'true'
        with:
          path: .git/octabam-port
          key: port-${{ steps.port.outputs.key }}

      # one unit saves it: the key is per run and every unit would write 130 MB
      - name: 💾 Save Compiler Cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && strategy.job-index == 0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - name: 📊 Compiler Cache Statistics
        if: always()
        run: ccache -s || true

  gates-result:
    # The one check for the gates: green when the plan ran and every unit
    # passed (or the plan had none).
    name: 🧪 Gates — make reach
    needs: [classify, plan, gates]
    if: >-
      always()
      && (github.event_name == 'push' || github.event_name == 'pull_request')
      && needs.classify.outputs.reach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: 🧮 Gate Results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gates.result }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          echo "plan: $PLAN, units: $COUNT, gates: $GATES"
          {
            echo "### 🧪 Gates"
            echo "plan: $PLAN, units: $COUNT, gates: $GATES"
            echo
            echo "| unit | result | time |"
            echo "|---|---|---|"
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '
              .jobs[] | select(.name | startswith("🧪 Gates — ")) | select(.name != "🧪 Gates — make reach")
              | "| [\(.name | ltrimstr("🧪 Gates — "))](\(.html_url)) | \(.conclusion // .status) | "
                + "\(if .completed_at then ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) else 0 end) s |"' || true
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$PLAN" = success ] || exit 1
          [ "$GATES" = success ] || { [ "$COUNT" = 0 ] && [ "$GATES" = skipped ]; }

  acceptance-runner:
    name: ✅ Acceptance Runner Tests
    needs: classify
    if: needs.classify.outputs.acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actions/checkout updates submodules one at a time; these are 16 clones
      - name: 📥 Submodules
        run: git submodule update --init --force --depth 1 --jobs 16

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 📦 Card Inspection Tool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof

      - name: ✅ Acceptance Runner Tests
        run: make test-acceptance

  docs:
    # Docs, the manual site and the web builder's patches: all load the
    # registry, whose manifests read the author submodules, so one checkout
    # serves them. The site builds with MkDocs shadcn: the generator runs the
    # registry, and mkdocs --strict fails on a bad manifest, a broken link or
    # a broken snippet include; the deploy is the Pages workflow on main, a PR
    # builds without deploying. The patches (docs/site/builder/) need no
    # firmware: the manifest must match the patch files, and on main each
    # remix the code has moved past is reported as a warning (rebuilt from a
    # machine with the user's 1.40C: make webpatch BUILD=N).
    name: 📚 Docs, Site and Web Patches
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # actions/checkout updates submodules one at a time; these are 16 clones
      - name: 📥 Submodules
        run: git submodule update --init --force --depth 1 --jobs 16

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # the manual site's pages include the generated reference files, so
      # they must exist before the doclinks scan of the tracked pages
      - name: 📝 Generate Pages
        run: python3 tools/site/gen_pages.py

      - name: 🔗 Verify Docs
        run: make verify-docs

      - name: 🧩 Check Patch Manifest
        run: |
          if [ -f docs/site/builder/manifest.json ]; then
            python3 tools/web/stale.py --check
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then python3 tools/web/stale.py; fi
          else
            echo "no published patches yet"
          fi

      - name: 📦 Install Site Dependencies
        if: github.event_name == 'pull_request' && needs.classify.outputs.site == 'true'
        run: pip install -r docs/site/requirements.txt

      - name: 🏗️ Build Site
        if: github.event_name == 'pull_request' && needs.classify.outputs.site == 'true'
        run: mkdocs build --strict --config-file docs/site/mkdocs.yml

  dsp-toolchain:
    name: 🎛️ DSP Toolchain — dsp56300
    needs: classify
    if: needs.classify.outputs.dsp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🎛️ Build and Test dsp56300
        run: make ci-dsp

  coldfire-port:
    name: 🔌 ColdFire Port Unit Tests (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.coldfire == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔌 Build and Test ColdFire Port
        run: make ci-emu
