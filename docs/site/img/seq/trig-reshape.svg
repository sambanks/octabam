<rect x="120" y="596" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="168" y="596" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="216" y="596" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect class="ring" x="213" y="593" width="46" height="46"/>
<rect x="264" y="596" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="312" y="596" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="360" y="596" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="408" y="596" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect class="ring" x="405" y="593" width="46" height="46"/>
<rect x="456" y="596" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<text class="lab" x="108" y="681.2" text-anchor="end">VOL</text>
<rect x="120" y="654" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="168" y="654" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="216" y="654" width="40" height="40" fill="url(#hatch)" stroke="#111" stroke-width="2"/>
<text class="tl" x="236.0" y="681.2" text-anchor="middle">TL</text>
<rect class="ring" x="213" y="651" width="46" height="46"/>
<rect x="264" y="654" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="312" y="654" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="360" y="654" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="408" y="654" width="40" height="40" fill="url(#hatch)" stroke="#111" stroke-width="2"/>
<text class="tl" x="428.0" y="681.2" text-anchor="middle">TL</text>
<rect class="ring" x="405" y="651" width="46" height="46"/>
<rect x="456" y="654" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<text class="t-xs" x="140.0" y="708" text-anchor="middle">1</text>
<text class="t-xs" x="188.0" y="708" text-anchor="middle">2</text>
<text class="t-xs" x="236.0" y="708" text-anchor="middle">3</text>
<text class="t-xs" x="284.0" y="708" text-anchor="middle">4</text>
<text class="t-xs" x="332.0" y="708" text-anchor="middle">5</text>
<text class="t-xs" x="380.0" y="708" text-anchor="middle">6</text>
<text class="t-xs" x="428.0" y="708" text-anchor="middle">7</text>
<text class="t-xs" x="476.0" y="708" text-anchor="middle">8</text>

  <text class="t-sm" x="40" y="700">PTCH is the current DEST: rewritten. VOL is not: kept, TL on dropped notes.</text>
  
  <g transform="translate(40,720)">
    <rect x="0" y="0" width="22" height="22" fill="#111" stroke="#111" stroke-width="2"/>
    <text class="t-xs" x="30" y="16">lock on note</text>
    <rect x="160" y="0" width="22" height="22" fill="url(#hatch)" stroke="#111" stroke-width="2"/>
<text class="tl" x="171.0" y="14.96" text-anchor="middle">TL</text>
    <text class="t-xs" x="190" y="16">trigless (TL)</text>
    <rect x="340" y="0" width="22" height="22" fill="#fff" stroke="#111" stroke-width="2"/>
    <text class="t-xs" x="370" y="16">empty</text>
    <rect class="ring" x="470" y="-3" width="28" height="28"/>
    <text class="t-xs" x="508" y="16">changed</text>
  </g>
</svg>
