<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" role="img">
  <title>PTCH follows new notes. VOL stays (TL where a note drops).</title>
  <rect width="700" height="760" fill="#fff"/>
  
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5">
      <path d="M0 5 L5 0" stroke="#111" stroke-width="1.6"/>
    </pattern>
    <marker id="a" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#111"/>
    </marker>
  </defs>
  <style>
    .t { font: 16px ui-monospace, Menlo, Consolas, monospace; fill:#111; font-weight:700; }
    .t-sm { font: 13px ui-monospace, Menlo, Consolas, monospace; fill:#222; }
    .t-xs { font: 12px ui-monospace, Menlo, Consolas, monospace; fill:#444; }
    .lab { font: 14px ui-monospace, Menlo, Consolas, monospace; fill:#111; font-weight:700; }
    .tl { font: 11px ui-monospace, Menlo, Consolas, monospace; fill:#111; font-weight:700; }
    .kn { font: 12px ui-monospace, Menlo, Consolas, monospace; fill:#111; }
    .kn-inv { font: 12px ui-monospace, Menlo, Consolas, monospace; fill:#fff; font-weight:700; }
    .kn-val { font: 13px ui-monospace, Menlo, Consolas, monospace; fill:#111; font-weight:700; }
    .kn-val-inv { font: 13px ui-monospace, Menlo, Consolas, monospace; fill:#fff; font-weight:700; }
    .arr { fill:none; stroke:#111; stroke-width:3; marker-end:url(#a); }
    .ring { fill:none; stroke:#111; stroke-width:3; }
    .panel { fill:#fff; stroke:#111; stroke-width:2; }
  </style>

  <rect class="panel" x="202" y="36" width="296" height="128" rx="2"/>
<rect x="210" y="44" width="88" height="52" fill="#111" stroke="#111" stroke-width="2"/>
<text class="kn-inv" x="216" y="60">PULS</text>
<text class="kn-val-inv" x="254.0" y="82" text-anchor="middle">new</text>
<text class="kn-inv" x="292" y="90" text-anchor="end">A</text>
<rect x="306" y="44" width="88" height="52" fill="#fff" stroke="#111" stroke-width="2"/>
<text class="kn" x="312" y="60">ROT</text>
<text class="kn-val" x="350.0" y="82" text-anchor="middle">0</text>
<text class="t-xs" x="388" y="90" text-anchor="end">B</text>
<rect x="402" y="44" width="88" height="52" fill="#111" stroke="#111" stroke-width="2"/>
<text class="kn-inv" x="408" y="60">LANE</text>
<text class="kn-val-inv" x="446.0" y="82" text-anchor="middle">TRIG</text>
<text class="kn-inv" x="484" y="90" text-anchor="end">C</text>
<rect x="210" y="104" width="88" height="52" fill="#111" stroke="#111" stroke-width="2"/>
<text class="kn-inv" x="216" y="120">DEST</text>
<text class="kn-val-inv" x="254.0" y="142" text-anchor="middle">PTCH</text>
<text class="kn-inv" x="292" y="150" text-anchor="end">D</text>
<rect x="306" y="104" width="88" height="52" fill="#fff" stroke="#111" stroke-width="2"/>
<text class="kn" x="312" y="120">DPTH</text>
<text class="kn-val" x="350.0" y="142" text-anchor="middle"></text>
<text class="t-xs" x="388" y="150" text-anchor="end">E</text>
<rect x="402" y="104" width="88" height="52" fill="#fff" stroke="#111" stroke-width="2"/>
<text class="t-xs" x="484" y="150" text-anchor="end">F</text>
  <text class="t-sm" x="350.0" y="186" text-anchor="middle">PTCH follows new notes. VOL stays (TL where a note drops).</text>

  <text class="t" x="40" y="222">BEFORE</text>
  <text class="t-xs" x="140" y="222">notes on 1 3 5 7, each has PTCH + VOL</text>
  <text class="lab" x="108" y="263.2" text-anchor="end">note</text>
<rect x="120" y="236" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="168" y="236" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="216" y="236" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="264" y="236" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="312" y="236" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="360" y="236" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
