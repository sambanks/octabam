<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img">
  <title>TRIG reshape keeps other DEST</title>
  <rect width="920" height="380" fill="#fff"/>
  
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M0 6 L6 0" stroke="#111" stroke-width="1.4"/>
    </pattern>
    <marker id="a" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#111"/>
    </marker>
  </defs>
  <style>
    .t { font: 15px ui-monospace, Menlo, Consolas, monospace; fill:#111; }
    .t-sm { font: 12px ui-monospace, Menlo, Consolas, monospace; fill:#333; }
    .t-xs { font: 11px ui-monospace, Menlo, Consolas, monospace; fill:#555; }
    .lab { font: 13px ui-monospace, Menlo, Consolas, monospace; fill:#111; }
    .arr { fill:none; stroke:#111; stroke-width:2.5; marker-end:url(#a); }
  </style>

  <text class="t" x="460" y="26" text-anchor="middle">TRIG YES · DEST=PTCH · change PULSE</text>
  <text class="t-sm" x="460" y="46" text-anchor="middle">Only PTCH follows the new notes. VOL is kept (trigless where a note drops).</text>

  <text class="t" x="40" y="78">BEFORE</text>
  <text class="t-xs" x="120" y="78">notes on steps 1 3 5 7, each with PTCH + VOL</text>
  <text class="lab" x="80" y="121.12" text-anchor="end">note</text>
<rect x="90" y="98" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="130" y="98" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="170" y="98" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="210" y="98" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="250" y="98" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="290" y="98" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="330" y="98" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="370" y="98" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<text class="lab" x="80" y="167.12" text-anchor="end">PTCH</text>
<rect x="90" y="144" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="130" y="144" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="170" y="144" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="210" y="144" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="250" y="144" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="290" y="144" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="330" y="144" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="370" y="144" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<text class="lab" x="80" y="213.12" text-anchor="end">VOL</text>
<rect x="90" y="190" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="130" y="190" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="170" y="190" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="210" y="190" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="250" y="190" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="290" y="190" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="330" y="190" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="370" y="190" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<text class="t-xs" x="107.0" y="234" text-anchor="middle">1</text>
<text class="t-xs" x="147.0" y="234" text-anchor="middle">2</text>
<text class="t-xs" x="187.0" y="234" text-anchor="middle">3</text>
<text class="t-xs" x="227.0" y="234" text-anchor="middle">4</text>
<text class="t-xs" x="267.0" y="234" text-anchor="middle">5</text>
<text class="t-xs" x="307.0" y="234" text-anchor="middle">6</text>
<text class="t-xs" x="347.0" y="234" text-anchor="middle">7</text>
<text class="t-xs" x="387.0" y="234" text-anchor="middle">8</text>

  <line class="arr" x1="430" y1="180" x2="490" y2="180"/>
  <text class="t-sm" x="460" y="168" text-anchor="middle">YES</text>
  <text class="t-xs" x="460" y="206" text-anchor="middle">new notes</text>
  <text class="t-xs" x="460" y="220" text-anchor="middle">1 and 5</text>

  <text class="t" x="520" y="78">AFTER</text>
  <text class="t-xs" x="600" y="78">PTCH reshaped · VOL kept as TL on 3 and 7</text>
  <text class="lab" x="560" y="121.12" text-anchor="end">note</text>
<rect x="570" y="98" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="610" y="98" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="650" y="98" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="690" y="98" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="730" y="98" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="770" y="98" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="810" y="98" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="850" y="98" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<text class="lab" x="560" y="167.12" text-anchor="end">PTCH</text>
<rect x="570" y="144" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="610" y="144" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="650" y="144" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="690" y="144" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="730" y="144" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="770" y="144" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="810" y="144" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="850" y="144" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<text class="lab" x="560" y="213.12" text-anchor="end">VOL</text>
<rect x="570" y="190" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="610" y="190" width="34" height="34" fill="url(#hatch)" stroke="#111" stroke-width="1.8"/>
<rect x="650" y="190" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="690" y="190" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<rect x="730" y="190" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="770" y="190" width="34" height="34" fill="url(#hatch)" stroke="#111" stroke-width="1.8"/>
<rect x="810" y="190" width="34" height="34" fill="#111" stroke="#111" stroke-width="1.8"/>
<rect x="850" y="190" width="34" height="34" fill="#fff" stroke="#111" stroke-width="1.8"/>
<text class="t-xs" x="587.0" y="234" text-anchor="middle">1</text>
<text class="t-xs" x="627.0" y="234" text-anchor="middle">2</text>
<text class="t-xs" x="667.0" y="234" text-anchor="middle">3</text>
<text class="t-xs" x="707.0" y="234" text-anchor="middle">4</text>
<text class="t-xs" x="747.0" y="234" text-anchor="middle">5</text>
<text class="t-xs" x="787.0" y="234" text-anchor="middle">6</text>
<text class="t-xs" x="827.0" y="234" text-anchor="middle">7</text>
<text class="t-xs" x="867.0" y="234" text-anchor="middle">8</text>

  <text class="t-sm" x="40" y="280">PTCH (current DEST): cleared on silent steps, rewritten on new notes</text>
  <text class="t-sm" x="40" y="302">VOL (other DEST): kept -- steps 3 and 7 become trigless so VOL stays audible</text>

  
  <g transform="translate(230,340)">
    <rect x="0" y="0" width="18" height="18" fill="#111" stroke="#111" stroke-width="1.8"/>
    <text class="t-xs" x="26" y="14">lock on a note</text>
    <rect x="150" y="0" width="18" height="18" fill="url(#hatch)" stroke="#111" stroke-width="1.8"/>
    <text class="t-xs" x="176" y="14">trigless lock</text>
    <rect x="310" y="0" width="18" height="18" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text class="t-xs" x="336" y="14">empty</text>
  </g>
</svg>
