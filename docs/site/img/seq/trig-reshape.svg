<rect x="360" y="538" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="408" y="538" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="456" y="538" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
