    .kn-val-inv { font: 13px ui-monospace, Menlo, Consolas, monospace; fill:#fff; font-weight:700; }
    .arr { fill:none; stroke:#111; stroke-width:2.5; marker-end:url(#a); }
    .panel { fill:#fff; stroke:#111; stroke-width:2; }
  </style>
