<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" width="1100" height="570" role="img">
  <title>trig-reshape</title>
  <rect width="1100" height="570" fill="#fff"/>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5">
