<rect x="120" y="294" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="168" y="294" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="216" y="294" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="264" y="294" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="312" y="294" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="360" y="294" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="408" y="294" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="456" y="294" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<text class="lab" x="108" y="379.2" text-anchor="end">VOL</text>
<rect x="120" y="352" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="168" y="352" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="216" y="352" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="264" y="352" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="312" y="352" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="360" y="352" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="408" y="352" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="456" y="352" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<text class="t-xs" x="140.0" y="406" text-anchor="middle">1</text>
<text class="t-xs" x="188.0" y="406" text-anchor="middle">2</text>
<text class="t-xs" x="236.0" y="406" text-anchor="middle">3</text>
<text class="t-xs" x="284.0" y="406" text-anchor="middle">4</text>
<text class="t-xs" x="332.0" y="406" text-anchor="middle">5</text>
<text class="t-xs" x="380.0" y="406" text-anchor="middle">6</text>
<text class="t-xs" x="428.0" y="406" text-anchor="middle">7</text>
<text class="t-xs" x="476.0" y="406" text-anchor="middle">8</text>

  <line class="arr" x1="350.0" y1="444" x2="350.0" y2="482"/>
  <text class="t" x="368.0" y="470">YES</text>
  <text class="t-xs" x="368.0" y="490">new notes: 1 and 5</text>

  <text class="t" x="40" y="524">AFTER</text>
  <text class="t-xs" x="140" y="524">PTCH only on 1 5. VOL kept as TL on 3 and 7.</text>
  <text class="lab" x="108" y="565.2" text-anchor="end">note</text>
<rect x="120" y="538" width="40" height="40" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="168" y="538" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="216" y="538" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="264" y="538" width="40" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
