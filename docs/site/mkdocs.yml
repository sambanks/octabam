site_name: Octabam
site_url: https://sambanks.github.io/octabam/
repo_url: https://github.com/sambanks/octabam
repo_name: sambanks/octabam
docs_dir: .
site_dir: ../../out/site
use_directory_urls: false
# the _remix-*.md fragments are snippet includes, not pages; usage/*.md
# are included into generated module pages, manual/*.md into the manuals; img/ holds image assets.
exclude_docs: |
  reference/_remix-*.md
  usage/*.md
  manual/*.md
extra_css:
  - css/fonts.css
  - css/sidebar-spacing.css
  - css/site-tables.css
  - css/manual.css
theme:
  name: shadcn
  # The theme follows the system appearance; its header toggle can override it.
  show_title: true
  show_stargazers: false
  pygments_style:
    light: shadcn-light
    dark: github-dark
nav:
  - Getting Started:
      - Overview: index.md
      - Choose a Remix: choosing.md
      - Build and Install: web-builder.md
      - Feature Directory: reference/modules.md
      - About: about.md
  - Manuals:
      - Octabam Manual:
          - Introduction: reference/manual/octabam/index.md
          - Bus and effect setup: reference/manual/octabam/bus-setup.md
          - Effects: reference/manual/octabam/effects.md
          - Machines and the sequencer: reference/manual/octabam/machines.md
          - Parts, Kits and scenes: reference/manual/octabam/parts.md
          - MIDI and USB: reference/manual/octabam/midi-usb.md
          - Settings and memory: reference/manual/octabam/settings.md
          - Utilities: reference/manual/octabam/utilities.md
          - Fixes to stock behaviour: reference/manual/octabam/fixes.md
          - Diagnostics: reference/manual/octabam/diagnostics.md
          - Effect Controls: reference/manual/octabam/appendix-controls.md
          - Test Status: reference/manual/octabam/appendix-status.md
          - Credits: reference/manual/octabam/credits.md
      - Octabam Bus Manual:
          - Introduction: reference/manual/octabam-bus/index.md
          - Bus and effect setup: reference/manual/octabam-bus/bus-setup.md
          - Effects: reference/manual/octabam-bus/effects.md
          - Machines and the sequencer: reference/manual/octabam-bus/machines.md
          - Parts, Kits and scenes: reference/manual/octabam-bus/parts.md
          - MIDI and USB: reference/manual/octabam-bus/midi-usb.md
          - Settings and memory: reference/manual/octabam-bus/settings.md
          - Utilities: reference/manual/octabam-bus/utilities.md
          - Fixes to stock behaviour: reference/manual/octabam-bus/fixes.md
          - Diagnostics: reference/manual/octabam-bus/diagnostics.md
          - Effect Controls: reference/manual/octabam-bus/appendix-controls.md
