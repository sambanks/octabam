site_name: Octabam
site_url: https://sambanks.github.io/octabam/
repo_url: https://github.com/sambanks/octabam
repo_name: sambanks/octabam
docs_dir: .
site_dir: ../../out/site
use_directory_urls: false
# the _remix-*.md fragments are snippet includes, not pages; usage/*.md
# are included into generated module pages, manual/*.md into the manuals; img/ holds image assets.
exclude_docs: |
  reference/_remix-*.md
  usage/*.md
  manual/*.md
extra_css:
  - css/fonts.css
  - css/sidebar-spacing.css
  - css/site-tables.css
  - css/manual.css
theme:
  name: shadcn
  # The theme follows the system appearance; its header toggle can override it.
  show_title: true
  show_stargazers: false
  pygments_style:
    light: shadcn-light
    dark: github-dark
nav:
  - Getting Started:
      - Overview: index.md
      - What is in Octabam: remix-octabam.md
      - Build and Install: web-builder.md
      - Safety and Recovery: safety.md
      - About: about.md
  - Octabam Remix Manual:
      - Introduction: reference/manual/octabam/index.md
      - Effects:
          - Character: reference/manual/octabam/effects/character.md
          - Modulation: reference/manual/octabam/effects/modulation.md
          - Spectrum: reference/manual/octabam/effects/spectrum.md
      - Machines:
          - OCTA-303: reference/manual/octabam/machines/octa303.md
      - Sequencer and recording:
          - Direct Jump (Kyoti): reference/manual/octabam/sequencer/direct-jump-kyoti.md
          - Euclid Fill: reference/manual/octabam/sequencer/euclid-fill.md
          - Mute Modes: reference/manual/octabam/sequencer/mute-modes.md
          - Pattern Mute: reference/manual/octabam/sequencer/pattern-mute.md
          - Quantize Live Rec Toggle: reference/manual/octabam/sequencer/quantize-live-rec-toggle.md
          - Rec Threshold: reference/manual/octabam/sequencer/rec-threshold.md
          - Recorder Trig Mute: reference/manual/octabam/sequencer/rec-trig-mute.md
          - Reload from Project: reference/manual/octabam/sequencer/reload-from-project.md
          - RLEN PLEN: reference/manual/octabam/sequencer/rlen-plen.md
          - Scale Quantizer: reference/manual/octabam/sequencer/quantizer.md
          - Track Patterns: reference/manual/octabam/sequencer/trackpatterns.md
          - Tuner: reference/manual/octabam/sequencer/tuner.md
      - Parts, Kits and scenes:
          - Kits: reference/manual/octabam/parts/kits.md
          - MIDI Scenes: reference/manual/octabam/parts/midi-scenes.md
          - Morph: reference/manual/octabam/parts/morph.md
          - Page 2 Parameter Locks: reference/manual/octabam/parts/plocks-p2.md
          - Page 2 Scene Locks: reference/manual/octabam/parts/scenes-p2.md
      - MIDI and USB:
          - CC Feedback: reference/manual/octabam/midi-usb/cc-feedback.md
          - CC Map: reference/manual/octabam/midi-usb/cc-map.md
          - USB: reference/manual/octabam/midi-usb/usb.md
      - BRAIN:
          - BRAIN: reference/manual/octabam/brain/index.md
          - Templates: reference/manual/octabam/brain/templates.md
          - Remixes: reference/manual/octabam/brain/remixes.md
          - Settings: reference/manual/octabam/brain/settings.md
          - Performance: reference/manual/octabam/brain/performance.md
          - Log: reference/manual/octabam/brain/log.md
          - About: reference/manual/octabam/brain/about.md
          - Files on the card: reference/manual/octabam/brain/files.md
      - Utilities:
          - Buffer Saver: reference/manual/octabam/utilities/buffer-saver.md
          - Copy Project: reference/manual/octabam/utilities/copy-project.md
          - FX2 Lock: reference/manual/octabam/utilities/fx2-lock.md
          - Mode Defaults: reference/manual/octabam/utilities/mode-defaults.md
          - Remix Switch: reference/manual/octabam/utilities/remix-switch.md
      - Fixes to stock behaviour:
          - ATA Write Guard: reference/manual/octabam/fixes/ata-write-guard.md
          - Batch Bugfixes: reference/manual/octabam/fixes/batch-bugfixes.md
          - Erase Empty Trigless Locks: reference/manual/octabam/fixes/erase-empty-trigless-locks.md
          - Lo-Fi AMF Fix: reference/manual/octabam/fixes/lofi-amf-fix.md
          - Recorder Loop Fix: reference/manual/octabam/fixes/recorder-loop-fix.md
      - Behind the scenes:
          - Effect Loader (Copier): reference/manual/octabam/inside/dlcopy.md
          - Effect Loader (Sender): reference/manual/octabam/inside/dlpump.md
          - Events: reference/manual/octabam/inside/events.md
          - Hooks: reference/manual/octabam/inside/hooks.md
          - Load Meter: reference/manual/octabam/inside/load-meter.md
          - Memory: reference/manual/octabam/inside/memory.md
          - Store: reference/manual/octabam/inside/store.md
      - Credits: reference/manual/octabam/credits.md
  - More:
      - Feature Directory: reference/modules.md
      - Create a Remix: own-remix.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      # resolved from the repository root: mkdocs runs there, locally and in CI
      base_path: [docs/site]
