# octabam is a scripts + Makefile project, not an installable package — the
# build and analysis tools deliberately run on bare `python3` with the stdlib
# only. This file exists for ONE reason: the interactive remixer's optional
# dependencies. The local ColdFire emulator (tools/emu/README.md) needs `unicorn`,
# and the remixer frontend (`make remix`) needs `textual`; both live in
# `.venv` as the `emu` extra (one extra on purpose — one setup command, and
# the remixer is the only consumer of either). The tooling prefers that
# venv and falls back to bare `python3`, where the build and every check
# still run; only the interactive views report themselves unavailable.
#
#   uv sync --extra emu     # or: make emu-setup
#
[project]
name = "octabam"
version = "0.1.0.dev0"
description = "A remixer for the Elektron Octatrack's OS: community modifications and custom DSP effects composed into one image"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
emu = [
    "unicorn>=2.1",
    "textual>=0.80",
    # the panel's audio output device (tools/panel, CoreAudio through PortAudio)
    "sounddevice>=0.5.6",
    # the harness's measurement tools (abkit, station_laws, click_scan,
    # clock_probe, cfmeter) and tools/hw's soak/ladder/usb probes
    "numpy>=1.24",
]

[tool.uv]
# Virtual project: do not try to build/install octabam itself, just manage the
# environment its scripts run in.
package = false

# `make lint` (CI's docs job): the errors a run would hit, checked against the
# FLOOR above, never the interpreter that happens to run it. target-version
# makes ruff refuse 3.12-only syntax (a backslash or a line break inside an
# f-string's braces), which CI's own 3.12 accepts and a 3.10 user's first
# `make` dies on. E9/F63/F7: syntax and misplaced statements; F82: undefined
# names; F601: a dict literal that repeats a key (the later value silently
# wins). Authors' trees (modules/*/upstream) and vendor/ are theirs.
[tool.ruff]
target-version = "py310"
extend-exclude = ["vendor", "out", "modules/*/upstream", ".claude"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F601"]
